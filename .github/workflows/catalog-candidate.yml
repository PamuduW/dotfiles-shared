name: Catalog candidate discovery

on:
  workflow_call:
    inputs:
      seed:
        description: Prepare initial unapproved data
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: Prepare the first unapproved catalog (never publishes it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover complete Linux AMD64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: dotfiles-shared
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PamuduW/agentbot
          ref: ${{ github.ref_name }}
          path: agentbot
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: PamuduW/dotfiles
          ref: ${{ github.ref_name }}
          path: dotfiles
      - name: Resolve frozen proposal with isolated discovery tools
        env:
          PREPARE_SEED: ${{ inputs.seed == true && '1' || '0' }}
          CATALOG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$PREPARE_SEED" == 1 ]]; then args+=(--seed); fi
          mkdir -m 700 "$RUNNER_TEMP/catalog-output"
          python3 dotfiles-shared/scripts/catalog/propose.py dotfiles-shared/catalog \
            --source "dotfiles-shared=$GITHUB_WORKSPACE/dotfiles-shared" \
            --source "agentbot=$GITHUB_WORKSPACE/agentbot" \
            --source "dotfiles=$GITHUB_WORKSPACE/dotfiles" \
            --output "$RUNNER_TEMP/catalog-output/candidate" \
            "${args[@]}" > "$RUNNER_TEMP/catalog-output/proposal.json"
      - name: Preserve unapproved data and source identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unapproved-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output
          if-no-files-found: error
          retention-days: 7
      - name: Install and smoke-test the selected tooling in a private home
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/catalog-output" "$GITHUB_WORKSPACE" <<'PYTHON'
          import json, pathlib, sys
          output, workspace = map(pathlib.Path, sys.argv[1:])
          proposal = json.loads((output / "proposal.json").read_text())
          context = {
              "schema_version": 1,
              "catalog": str(output / "candidate"),
              "digest": proposal["catalog_digest"],
              "sources": {name: str(workspace / name) for name in proposal["sources"]},
          }
          with (output / "qualification-context.json").open("x") as stream:
              json.dump(context, stream)
          PYTHON
          bash dotfiles/scripts/catalog/bootstrap-tools.sh \
            "$RUNNER_TEMP/catalog-output/qualification-context.json" \
            "$RUNNER_TEMP/catalog-tooling-home" "$RUNNER_TEMP/catalog-tools.json"
          env -i PATH="$RUNNER_TEMP/catalog-tooling-home/.local/bin:/usr/bin:/bin" \
            LANG=C.UTF-8 HOME="$RUNNER_TEMP/catalog-tooling-home" USER="$(id -un)" \
            SKILLS_DISABLE_TELEMETRY=1 \
            python3 agentbot/scripts/catalog/qualify-tooling.py \
              "$RUNNER_TEMP/catalog-output/qualification-context.json" \
              --output "$RUNNER_TEMP/catalog-tooling-smoke.json"
      - name: Preserve tooling smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooling-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-tooling-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Install real user-local tools in clean Ubuntu
        run: |
          set -euo pipefail
          image="catalog-user-tools:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --build-arg "TEST_UID=$(id -u)" --tag "$image" \
            --file dotfiles/scripts/catalog/Dockerfile.qualify dotfiles/scripts/catalog
          docker image inspect --format '{{.Id}}' "$image"
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 --pids-limit=512 \
            --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/dotfiles:$GITHUB_WORKSPACE/dotfiles:ro" \
            --volume "$GITHUB_WORKSPACE/agentbot:$GITHUB_WORKSPACE/agentbot:ro" \
            --volume "$GITHUB_WORKSPACE/dotfiles-shared:$GITHUB_WORKSPACE/dotfiles-shared:ro" \
            --volume "$RUNNER_TEMP/catalog-output:$RUNNER_TEMP/catalog-output" \
            "$image" bash -c '
              set -euo pipefail
              bash "$1/dotfiles/scripts/catalog/bootstrap-tools.sh" \
                "$2/qualification-context.json" /home/op/test-home /home/op/tools.json
              env -i PATH=/home/op/test-home/.local/bin:/usr/bin:/bin \
                HOME=/home/op/test-home USER=op LANG=C.UTF-8 \
                python3 "$1/dotfiles/scripts/catalog/qualify-user-tools.py" \
                  "$2/qualification-context.json" --output "$2/user-tools-smoke.json"
              env -i PATH=/home/op/test-home/.local/bin:/usr/bin:/bin \
                HOME=/home/op/test-home USER=op LANG=C.UTF-8 \
                bash "$1/dotfiles/scripts/catalog/qualify-fonts.sh" \
                  "$2/qualification-context.json" "$2/font-smoke.json"
              env -i PATH=/home/op/test-home/.local/bin:/usr/bin:/bin \
                HOME=/home/op/test-home USER=op LANG=C.UTF-8 \
                bash "$1/dotfiles/scripts/catalog/qualify-behavior.sh" \
                  "$2/qualification-context.json" "$2/behavior-smoke.json"
            ' bash "$GITHUB_WORKSPACE" "$RUNNER_TEMP/catalog-output"
      - name: Install vendor packages and exercise local applications
        run: |
          set -euo pipefail
          image="catalog-vendor:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --build-arg "BASE_IMAGE=catalog-user-tools:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --tag "$image" --file dotfiles/scripts/catalog/Dockerfile.vendor-qualify dotfiles/scripts/catalog
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 --pids-limit=512 \
            --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/dotfiles:$GITHUB_WORKSPACE/dotfiles:ro" \
            --volume "$GITHUB_WORKSPACE/agentbot:$GITHUB_WORKSPACE/agentbot:ro" \
            --volume "$GITHUB_WORKSPACE/dotfiles-shared:$GITHUB_WORKSPACE/dotfiles-shared:ro" \
            --volume "$RUNNER_TEMP/catalog-output:$RUNNER_TEMP/catalog-output" \
            "$image" env -i PATH=/usr/bin:/bin HOME=/home/op USER=op LANG=C.UTF-8 \
              GITHUB_ACTIONS=true python3 dotfiles/scripts/catalog/qualify-vendor-packages.py \
                "$RUNNER_TEMP/catalog-output/qualification-context.json" \
                --output "$RUNNER_TEMP/catalog-output/vendor-package-smoke.json"
      - name: Preserve vendor-package and application evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-package-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/vendor-package-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Exercise real editor extensions and pinned skill sources
        run: |
          set -euo pipefail
          image="catalog-user-tools:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker run --rm --memory=4g --memory-swap=4g --cpus=2 --pids-limit=512 \
            --workdir "$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/dotfiles:$GITHUB_WORKSPACE/dotfiles:ro" \
            --volume "$GITHUB_WORKSPACE/agentbot:$GITHUB_WORKSPACE/agentbot:ro" \
            --volume "$GITHUB_WORKSPACE/dotfiles-shared:$GITHUB_WORKSPACE/dotfiles-shared:ro" \
            --volume "$RUNNER_TEMP/catalog-output:$RUNNER_TEMP/catalog-output" \
            --volume "$RUNNER_TEMP/catalog-tooling-home/.local/share/software-catalog/python-runtime:$RUNNER_TEMP/catalog-tooling-home/.local/share/software-catalog/python-runtime:ro" \
            "$image" bash -c '
              set -euo pipefail
              bash "$1/dotfiles/scripts/catalog/bootstrap-tools.sh" \
                "$2/qualification-context.json" /home/op/test-home /home/op/tools.json
              env -i PATH=/home/op/test-home/.local/bin:/usr/bin:/bin \
                HOME=/home/op/test-home USER=op LANG=C.UTF-8 \
                SKILLS_DISABLE_TELEMETRY=1 \
                "$1/agentbot/.venv/bin/python" "$1/agentbot/scripts/catalog/qualify-integrations.py" \
                  "$2/qualification-context.json" --output "$2/integration-smoke.json"
            ' bash "$GITHUB_WORKSPACE" "$RUNNER_TEMP/catalog-output"
      - name: Preserve editor and skill-source evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/integration-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve user-tools smoke evidence and container scan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: user-tools-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/catalog-output/user-tools-smoke.json
            ${{ runner.temp }}/catalog-output/container-vulnerabilities.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve Linux font smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: font-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/font-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve representative behavior evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: behavior-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/behavior-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Exercise the selected Docker daemon and Portainer lifecycle
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin USER="$(id -un)" LANG=C.UTF-8 \
            HOME="$RUNNER_TEMP/catalog-tooling-home" GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            python3 dotfiles/scripts/catalog/qualify-docker.py \
              "$RUNNER_TEMP/catalog-output/qualification-context.json" \
              --disposable-host --output "$RUNNER_TEMP/catalog-output/docker-lifecycle-smoke.json"
      - name: Preserve Docker lifecycle evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-lifecycle-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/docker-lifecycle-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Audit complete fresh and repeat inventory coverage
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            python3 dotfiles-shared/scripts/catalog/audit-smoke.py \
              "$RUNNER_TEMP/catalog-output/qualification-context.json" \
              --receipt "$RUNNER_TEMP/catalog-tooling-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/user-tools-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/vendor-package-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/font-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/behavior-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/integration-smoke.json" \
              --receipt "$RUNNER_TEMP/catalog-output/docker-lifecycle-smoke.json" \
              --output "$RUNNER_TEMP/catalog-output/inventory-smoke-audit.json"
      - name: Preserve fresh and repeat inventory audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventory-smoke-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-output/inventory-smoke-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Explain result
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This job prepares candidate data only. It cannot approve or publish versions.
          A discovery or dependency failure retains the existing catalog.
          Tooling smoke tests cover real Node/npm/uv provisioning and fresh/repeat
          Agentbot Python and Skills CLI installs. They do not qualify the full inventory.
          A clean Ubuntu container also exercises fresh/repeat user-local tools.
          Linux font smoke verifies real registration and font matching; Windows fonts are outside scope.
          Behavior smoke executes Node, compiles Go, checks Chrome DOM output and renders Mermaid SVG.
          Additional containers exercise vendor apt packages, PowerShell/Obsidian,
          Linux editor extensions and pinned skill-source content. Docker/Portainer lifecycle
          are exercised on the disposable hosted VM after all container tests.
          Baseline upgrades and complete failure recovery still need separate coverage.
          An inventory audit requires all selected Linux component observations and matching sources.
          It explicitly leaves baseline upgrades, full failure safety, product gates and
          all updater controls unqualified. The protected publisher is still required.
          SUMMARY
