name: Validate

# This repository has no suite of its own -- its code runs inside two products,
# and those products' suites are its tests. So CI does two things: lint what is
# here, then run both consumers against this checkout. A change here that breaks
# either product fails on this repository, where it was made, rather than on
# whichever consumer next happened to run.
on:
  # This one keeps its push trigger where the two products dropped theirs. Its
  # job is to run BOTH consumers against this checkout, so a break here is a
  # break in code neither consumer has pulled yet. Waiting for a daily run
  # would surface it up to a day later, on whichever product happened to run
  # next -- which is exactly the failure this repository exists to prevent.
  # `development` is here because that is where the work happens now. A
  # contract break caught only on main is caught after the merge that
  # introduced it, which is too late to be the early warning this trigger
  # exists to be.
  push:
    branches: [main, development]
  workflow_dispatch:
  # Daily as well, at 10:00 Asia/Colombo (04:30 UTC, which is what cron
  # takes), because the other half of what breaks it is upstream: the
  # runner image, apt, and the versions of shellcheck, shfmt and ruff it ships.
  # A scheduled failure is a known environment change; the same failure found
  # mid-task is a mystery.
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint this tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff>=0.12,<1'
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      # Until this repository existed, the shell here was linted by whichever
      # consumer vendored it and the Python was linted by neither. Both are
      # linted here now, against the same rule selection Agentbot applies.
      - name: Bash syntax
        run: find scripts tests -name '*.sh' -exec bash -n {} +
      - name: ShellCheck
        run: shellcheck -x -e SC1091,SC2178,SC2313 $(find scripts tests -name '*.sh')
      - name: Formatting
        run: shfmt -d $(find scripts tests -name '*.sh')
      - name: Ruff
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
      - name: Whitespace errors
        run: git diff --check

  contract:
    name: CONTRACT agreement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles-shared
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PamuduW/dotfiles
          path: dotfiles
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PamuduW/agentbot
          path: agentbot
      # Agentbot's own check compares its two resolvers to each other. This is
      # the only place all four declarations are in one checkout at once.
      - name: Every declaration agrees
        run: |
          bash dotfiles-shared/scripts/check_contract_agreement.sh \
            dotfiles-shared dotfiles agentbot

  consumers:
    name: ${{ matrix.consumer }} against this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: agentbot
            gate: bash tests/run.sh
          - consumer: dotfiles
            gate: bash scripts/validate.sh
    steps:
      # Laid out the way a real machine is: the shared checkout is a sibling of
      # the product, which is what the resolvers look for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dotfiles-shared
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PamuduW/${{ matrix.consumer }}
          path: ${{ matrix.consumer }}
      # Only where the consumer's own workflow does. Dotfiles is a Bash product
      # whose suite uses the system interpreter; putting a tool-cache Python in
      # front of it is a difference from its own CI, and its bootstrap suite
      # failed on exactly that.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.consumer == 'agentbot'
        with:
          python-version: "3.10"
      - name: Install tooling
        working-directory: ${{ matrix.consumer }}
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt -r requirements-dev.txt
          fi
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt ripgrep
      - name: Run the consumer's gate
        working-directory: ${{ matrix.consumer }}
        run: ${{ matrix.gate }}
